# Lancement local. Les secrets viennent de apps/web/.env.local (non versionné) :
#   docker compose --env-file apps/web/.env.local up -d db        # base seule, pour le développement
#   docker compose --env-file apps/web/.env.local up -d --build   # base + image de production
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: eclauses
      POSTGRES_USER: eclauses
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD dans apps/web/.env.local}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eclauses -d eclauses"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Stockage objet de test (profil `s3`) : docker compose --profile s3 up -d minio
  minio:
    profiles: ["s3"]
    image: minio/minio:latest
    command: server /data
    environment:
      MINIO_ROOT_USER: eclauses-test
      MINIO_ROOT_PASSWORD: ${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD dans apps/web/.env.local}
    ports:
      - "127.0.0.1:9100:9000"

  web:
    build: .
    image: eclauses-web:local
    ports:
      - "3200:3000"
    env_file:
      - apps/web/.env.local
    environment:
      DATABASE_URL: postgres://eclauses:${POSTGRES_PASSWORD}@db:5432/eclauses
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - fichiers:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  pgdata:
  fichiers:
